name: tests

on:
  push:
    branches: [main, rust-port]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: stable
            experimental: false
          - toolchain: beta
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: native TLS build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: install toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: build
        run: cargo +${{ matrix.toolchain }} build --release --locked
      - name: test
        run: cargo +${{ matrix.toolchain }} test --locked
      - name: clippy
        run: cargo +${{ matrix.toolchain }} clippy --locked --all-targets -- -D warnings
      - name: formatting
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check

  hygiene:
    name: shell syntax and secret guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shell scripts parse
        run: |
          for script in system_report/bin/*.sh tests/*.sh; do
            bash -n "${script}"
          done

      - name: installer and wrapper smoke tests
        run: bash tests/scripts.sh

      - name: only example files are committed under data/
        run: |
          committed="$(git ls-files data/ | grep -v '\.example$' || true)"
          if [ -n "${committed}" ]; then
            echo "::error::non-example file(s) committed under data/: ${committed}"
            exit 1
          fi

      - name: no inline secrets in tracked files
        run: |
          hits="$(git grep -nIiE '^[[:space:]]*(password|passwd|token|api[_-]?key)[[:space:]]*:[[:space:]]*[^[:space:]#]' -- . ':!*.example' || true)"
          hits="$(printf '%s' "${hits}" | grep -vEi ":[[:space:]]*(null|~|\"\"|'')[[:space:]]*$" || true)"
          if [ -n "${hits}" ]; then
            echo "${hits}"
            echo "::error::the line(s) above look like a committed secret"
            exit 1
          fi
