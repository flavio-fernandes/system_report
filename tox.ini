[tox]
envlist=py3,pep8
skipsdist=True

[testenv]
commands=pytest system_report/tests/unit
deps=pytest

[testenv:pep8]
basepython=python3
deps=flake8
commands=flake8 {toxinidir}/system_report

[flake8]
# E126 continuation line over-indented for hanging indent
# E128 continuation line under-indented for visual indent
# W503 line break before binary operator
max-line-length = 99
ignore = E126,E128,W503
show-source = true
exclude = ./.*,build,dist,env

[pytest]
testpaths = system_report/tests/unit
